name: k8s build and deploy

# Reusable workflow for apps on the zonnestralen k3s cluster (infra-tg).
#   build:  GitHub-hosted runner, pushes ghcr.io/<owner>/<repo>:<sha>
#   deploy: the app repo's own ARC runner scale set; kubectl uses the runner pod's ServiceAccount
#           (namespace-scoped), so no kubeconfig is stored in GitHub.
# Both jobs only run on the default branch.

on:
  workflow_call:
    inputs:
      app:
        description: App name = namespace (and default Deployment name).
        required: true
        type: string
      context:
        description: Docker build context.
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      k8s-dir:
        description: Directory with kustomization.yaml (image name `app`).
        type: string
        default: k8s
      rollout:
        description: Space-separated Deployments to wait for. Empty for CronJob-only apps. Defaults to the app name.
        type: string
        default: __app__
      rollout-timeout:
        type: string
        default: 5m
      runs-on:
        description: Label of the ARC runner scale set.
        type: string
        default: zonnestralen
      build-app-id:
        description: >-
          GitHub App with read access to private repos the build needs (e.g. git dependencies).
          Its token is passed to the Docker build as secret `github_token`. Empty: no token.
        type: string
        default: ""
      build-app-repositories:
        description: Comma-separated repos of the caller's owner that the build token can read.
        type: string
        default: ""
    secrets:
      build-app-private-key:
        description: Private key of the build-app-id GitHub App.
        required: false

env:
  KUBECTL_VERSION: v1.36.5
  KUBECTL_SHA256: 33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e
  KUSTOMIZE_VERSION: v5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Short-lived token for private repos the build needs; the Dockerfile reads it with
      # `RUN --mount=type=secret,id=github_token,required=false`.
      - id: build-token
        if: inputs.build-app-id != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.build-app-id }}
          private-key: ${{ secrets.build-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.build-app-repositories }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}
          secrets: ${{ steps.build-token.outputs.token && format('github_token={0}', steps.build-token.outputs.token) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl and kustomize
        run: |
          mkdir -p "$HOME/bin"
          cd "$HOME/bin"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl
          tarball="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tarball}"
          echo "${KUSTOMIZE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" kustomize && rm "$tarball"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Deploy
        working-directory: ${{ inputs.k8s-dir }}
        env:
          APP: ${{ inputs.app }}
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          ROLLOUT: ${{ inputs.rollout }}
          TIMEOUT: ${{ inputs.rollout-timeout }}
        run: |
          kustomize edit set image "app=${IMAGE}"
          kubectl apply -k .
          if [[ $ROLLOUT == __app__ ]]; then ROLLOUT=$APP; fi
          for d in $ROLLOUT; do
            kubectl rollout status "deployment/$d" -n "$APP" --timeout="$TIMEOUT"
          done
